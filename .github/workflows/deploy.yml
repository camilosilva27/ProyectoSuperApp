name: Deploy backend a la VM

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/ProyectoSuperApp
            git pull
            cd backend
            npm install
            sudo systemctl restart allpromos-backend
            sleep 2
            sudo systemctl is-active allpromos-backend
