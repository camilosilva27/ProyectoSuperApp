name: Scraping de catálogos

# Corre los 7 scrapers + sus "extras" (la parte que más CPU pedía en la VM, ver
# CONTEXTO_TECNICO.md § "VM: limpieza de RAM/CPU y migración de crons a GitHub Actions").
# El repo es público, así que este cron corre gratis sin límite de minutos.
#
# Lo dispara SOLO el cron de la VM (backend/scripts/disparar-scrapers.sh, cada 2hs, vía la API
# de workflow_dispatch) — o a mano desde la pestaña Actions. Se sacó el `schedule` nativo
# (auditoría 2026-09-24): quedaba activo EN PARALELO al disparo de la VM y, cuando GitHub sí lo
# corría, duplicaba la corrida (4 corridas extra por día en prod, doble tráfico a los supers y
# dos subidas de catálogos pisándose en la VM). Se había dejado de usar por poco confiable, ver
# backend/README.md § "Cron".
on:
  workflow_dispatch: {}

# Una sola corrida a la vez: si un disparo llega mientras otra sigue (ej. Carrefour lento),
# queda en espera en vez de correr en paralelo. Sin cancelar la que está en curso: cortarla a
# mitad de `subir-catalogos.sh` dejaría el post-proceso sin correr.
concurrency:
  group: scrapers
  cancel-in-progress: false

jobs:
  scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Bajar catálogos vigentes de la VM
        run: bash .github/scripts/bajar-catalogos.sh

      - name: Correr scrapers + extras
        working-directory: backend
        run: node src/cron/refrescarCatalogosGHA.js

      - name: Subir catálogos y disparar post-proceso en la VM
        if: always()
        run: bash .github/scripts/subir-catalogos.sh
